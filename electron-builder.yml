appId: com.modocreador.productividad
productName: MODO CREADOR - Productividad
copyright: © 2026 MODO CREADOR

directories:
  buildResources: build
  output: dist

# Dónde se publican los releases y desde dónde se auto-actualiza la app.
# Cambia owner/repo si el repositorio queda bajo otra cuenta u organización.
publish:
  provider: github
  owner: neohretro
  repo: modo-productividad
  releaseType: release # publica el release directo (no como borrador)

files:
  - out/**
  - package.json
  - '!**/{.vscode,.github,test,scripts}'
  - '!**/*.{ts,tsx,map}'
  - '!**/{tsconfig*.json,tailwind.config.ts,postcss.config.js,electron.vite.config.*,vitest.config.ts,eslint.config.*}'
  - '!**/{.env,.env.*,.editorconfig,.prettier*,README.md,PLAN.md,BRAND.md,AGENTS.md,CLAUDE.md}'

asarUnpack:
  - resources/**

win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.ico
  artifactName: MODO-Creador-Productividad-${version}-setup.${ext}
  requestedExecutionLevel: asInvoker

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: MODO CREADOR - Productividad
  deleteAppDataOnUninstall: false

# macOS SIN firma de Apple (por ahora). `identity: '-'` firma "ad hoc": hace falta para
# que el Mac con chip Apple abra la app, pero NO es un certificado de desarrollador, así
# que la primera vez hay que abrirla con clic derecho > Abrir (ver docs/MAC.md).
# Cuando haya cuenta de Apple Developer: quitar `identity` y activar `notarize`.
mac:
  target:
    - target: dmg
      arch: [arm64, x64]
  icon: build/icon.png
  category: public.app-category.productivity
  artifactName: MODO-Creador-Productividad-${version}-mac-${arch}.${ext}
  identity: '-'
  hardenedRuntime: false
  gatekeeperAssess: false

dmg:
  sign: false
